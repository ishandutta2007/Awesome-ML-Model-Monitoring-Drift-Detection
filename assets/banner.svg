<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="driftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fb923c" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="baselineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#64748b" fill-opacity="0.3" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        letter-spacing: 0.2px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }
      .metric-text {
        font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', monospace;
        font-size: 12px;
        fill: #cbd5e1;
      }

      /* Dynamic Animations */
      @keyframes waveDrift1 {
        0% { transform: translateX(0px) scaleY(1); }
        50% { transform: translateX(-60px) scaleY(1.08); }
        100% { transform: translateX(0px) scaleY(1); }
      }
      @keyframes waveDrift2 {
        0% { transform: translateX(0px) scaleY(1); }
        50% { transform: translateX(50px) scaleY(0.92); }
        100% { transform: translateX(0px) scaleY(1); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.4; }
        50% { opacity: 0.85; }
        100% { opacity: 0.4; }
      }
      @keyframes scanBeam {
        0% { transform: translateY(0px); opacity: 0; }
        15% { opacity: 0.8; }
        85% { opacity: 0.8; }
        100% { transform: translateY(340px); opacity: 0; }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-20px) translateX(15px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.8); }
      }

      .animated-wave-1 {
        animation: waveDrift1 10s ease-in-out infinite;
      }
      .animated-wave-2 {
        animation: waveDrift2 12s ease-in-out infinite;
      }
      .animated-pulse {
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .animated-beam {
        animation: scanBeam 6s linear infinite;
      }
      .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
      .particle-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
      .dot-live { animation: blinkDot 2s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />
  <rect width="100%" height="100%" fill="url(#gridPattern)" rx="16" />

  <!-- Ambient Glow Behind Graphs -->
  <circle cx="200" cy="330" r="160" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="animated-pulse" />
  <circle cx="1020" cy="330" r="180" fill="#f43f5e" opacity="0.12" filter="url(#glow)" class="animated-pulse" />
  <circle cx="600" cy="210" r="220" fill="#818cf8" opacity="0.08" filter="url(#glow)" />

  <!-- Background Dynamic Distribution Waves (Lower Area to avoid text collision) -->
  <g opacity="0.65">
    <!-- Baseline Distribution Curve (Normal) -->
    <path class="animated-wave-1" d="M -50 370 C 150 370, 220 290, 320 290 C 420 290, 480 370, 680 370 C 880 370, 940 310, 1040 310 C 1140 310, 1200 370, 1300 370 L 1300 420 L -50 420 Z" 
          fill="url(#baselineGrad)" fill-opacity="0.18" stroke="#10b981" stroke-width="2" stroke-opacity="0.6" />

    <!-- Drifted Distribution Curve (Shifted) -->
    <path class="animated-wave-2" d="M -50 380 C 120 380, 260 330, 390 330 C 500 330, 560 385, 750 385 C 900 385, 1010 270, 1110 270 C 1200 270, 1250 380, 1350 380 L 1350 420 L -50 420 Z" 
          fill="url(#driftGrad)" fill-opacity="0.15" stroke="#f43f5e" stroke-width="2.5" stroke-opacity="0.7" stroke-dasharray="6,4" />
  </g>

  <!-- Animated Telemetry Scan Beam Line -->
  <g class="animated-beam" opacity="0.5">
    <line x1="50" y1="40" x2="1150" y2="40" stroke="url(#primaryGrad)" stroke-width="1.5" filter="url(#softGlow)" />
  </g>

  <!-- Ambient Floating Data Particles -->
  <circle cx="180" cy="120" r="2.5" fill="#38bdf8" class="particle-1" />
  <circle cx="310" cy="70" r="3" fill="#818cf8" class="particle-2" />
  <circle cx="890" cy="90" r="2" fill="#c084fc" class="particle-3" />
  <circle cx="1040" cy="140" r="3.5" fill="#f43f5e" class="particle-1" />
  <circle cx="950" cy="310" r="2.5" fill="#fb923c" class="particle-2" />

  <!-- Foreground UI Badges & Status Indicators (Safe Header Area) -->
  <g transform="translate(60, 48)">
    <!-- Category Pill -->
    <rect width="180" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="4.5" fill="#10b981" class="dot-live" />
    <text x="26" y="18" fill="#38bdf8" class="tag-text">MLOps Observability</text>

    <!-- Drift Monitor Alert Pill -->
    <g transform="translate(192, 0)">
      <rect width="188" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="14" cy="14" r="4.5" fill="#f43f5e" class="dot-live" />
      <text x="26" y="18" fill="#fca5a5" class="tag-text">Drift Detection Active</text>
    </g>

    <!-- Telemetry Metric Pill (Far Right) -->
    <g transform="translate(860, 0)">
      <rect width="220" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="14" y="18" class="metric-text"><tspan fill="#38bdf8">PSI: </tspan>0.042  <tspan fill="#10b981">•</tspan>  <tspan fill="#fb923c">KS-p: </tspan>0.89</text>
    </g>
  </g>

  <!-- Central Foreground Content Card (Ensures complete readability and zero occlusion) -->
  <g transform="translate(60, 105)">
    <!-- Subtle Frosted Backdrop for Content -->
    <rect width="1080" height="175" rx="16" fill="#0f172a" fill-opacity="0.82" stroke="#334155" stroke-opacity="0.6" stroke-width="1" />

    <!-- Title Badge -->
    <g transform="translate(36, 32)">
      <text class="title-text" fill="url(#primaryGrad)">Awesome ML Model Monitoring</text>
      <text x="615" y="0" class="title-text" fill="#f8fafc">&amp; Drift Detection</text>
    </g>

    <!-- Subtitle Line 1 -->
    <text x="36" y="85" class="subtitle-text">
      The definitive, curated landscape of production SaaS platforms and open-source frameworks for real-time model observability.
    </text>

    <!-- Subtitle Line 2 / Feature highlights -->
    <g transform="translate(36, 122)">
      <!-- Feature Pill 1 -->
      <rect width="168" height="26" rx="6" fill="#1e293b" />
      <text x="12" y="17" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#7dd3fc">🛡️ Silent Failure Detection</text>

      <!-- Feature Pill 2 -->
      <g transform="translate(178, 0)">
        <rect width="186" height="26" rx="6" fill="#1e293b" />
        <text x="12" y="17" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#a5b4fc">📊 Data &amp; Concept Drift (PSI/KS)</text>
      </g>

      <!-- Feature Pill 3 -->
      <g transform="translate(374, 0)">
        <rect width="170" height="26" rx="6" fill="#1e293b" />
        <text x="12" y="17" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#fbcfe8">🎯 Ground-Truth Estimation</text>
      </g>

      <!-- Feature Pill 4 -->
      <g transform="translate(554, 0)">
        <rect width="165" height="26" rx="6" fill="#1e293b" />
        <text x="12" y="17" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#fed7aa">🔕 Alert Fatigue Prevention</text>
      </g>

      <!-- Feature Pill 5 -->
      <g transform="translate(729, 0)">
        <rect width="155" height="26" rx="6" fill="#1e293b" />
        <text x="12" y="17" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#bbf7d0">🔍 LLM &amp; Agent Tracing</text>
      </g>
    </g>
  </g>

  <!-- Bottom Visual Telemetry Indicator Bar -->
  <g transform="translate(60, 345)">
    <!-- Legend -->
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#10b981" />
    <text x="18" y="10" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Baseline Distribution (Ref)</text>

    <rect x="180" y="0" width="12" height="12" rx="3" fill="#f43f5e" />
    <text x="198" y="10" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Inference Distribution (Drifted)</text>

    <circle cx="390" cy="6" r="4" fill="#38bdf8" />
    <text x="402" y="10" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Wasserstein / KS-Test Statistic</text>

    <text x="910" y="10" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#64748b">STATUS: MONITORED IN PRODUCTION</text>
  </g>
</svg>
